<svg width="480" height="560" viewBox="0 0 480 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a tooth with a blue paint splash" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="toothGrad" x1="240" y1="20" x2="240" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.4" stop-color="#FDFEFF" />
      <stop offset="0.55" stop-color="#8FD2F2" />
      <stop offset="0.7" stop-color="#2AAAE8" />
      <stop offset="1" stop-color="#0C74B8" />
    </linearGradient>
    <linearGradient id="splashGrad" x1="0" y1="0" x2="480" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#48B8EE" />
      <stop offset="1" stop-color="#0E6FB2" />
    </linearGradient>
    <radialGradient id="shine" cx="0.35" cy="0.22" r="0.35">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="240" cy="520" rx="110" ry="18" fill="#0C74B8" opacity="0.12" />

  <!-- scattered splash droplets (behind + around the tooth) -->
  <g fill="url(#splashGrad)">
    <circle cx="95" cy="150" r="10" opacity="0.9" />
    <circle cx="70" cy="200" r="6" opacity="0.8" />
    <circle cx="120" cy="230" r="14" opacity="0.85" />
    <circle cx="385" cy="120" r="12" opacity="0.9" />
    <circle cx="410" cy="175" r="7" opacity="0.8" />
    <circle cx="360" cy="205" r="9" opacity="0.85" />
    <circle cx="405" cy="260" r="16" opacity="0.85" />
    <circle cx="350" cy="330" r="8" opacity="0.75" />
    <circle cx="60" cy="300" r="9" opacity="0.75" />
    <circle cx="100" cy="340" r="6" opacity="0.7" />
    <path d="M330 90 C345 70 372 68 380 90 C388 112 368 128 348 122 C328 116 315 110 330 90Z" opacity="0.9" />
    <path d="M140 95 C128 75 100 76 92 98 C84 120 106 134 126 126 C146 118 156 115 140 95Z" opacity="0.9" />
    <path d="M355 250 C378 244 398 262 392 284 C386 306 358 308 346 290 C334 272 332 256 355 250Z" opacity="0.85" />
    <path d="M300 350 C320 340 342 352 340 372 C338 392 314 400 300 386 C286 372 280 360 300 350Z" opacity="0.8" />
  </g>

  <!-- main tooth shape (crown fades from white to blue at the root) -->
  <path
    d="M240 26
       C 300 14 356 44 362 104
       C 366 146 349 172 344 200
       C 358 224 374 256 369 298
       C 364 344 330 350 320 398
       C 311 440 298 486 274 486
       C 254 486 250 434 244 402
       C 241 386 239 386 236 402
       C 230 434 226 486 206 486
       C 182 486 169 440 160 398
       C 150 350 116 344 111 298
       C 106 256 122 224 136 200
       C 131 172 114 146 118 104
       C 124 44 180 14 240 26 Z"
    fill="url(#toothGrad)"
    stroke="#E4F3FB"
    stroke-width="1.5"
  />

  <!-- highlight -->
  <ellipse cx="185" cy="110" rx="70" ry="50" fill="url(#shine)" />

  <!-- small foreground droplets over the tooth edges for integration -->
  <g fill="url(#splashGrad)">
    <circle cx="340" cy="330" r="7" opacity="0.9" />
    <circle cx="150" cy="360" r="6" opacity="0.85" />
    <circle cx="325" cy="410" r="5" opacity="0.8" />
  </g>
</svg>
